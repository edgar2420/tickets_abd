# =====================================================================
# Sistema de Gestion de Tickets TI & Control de Acceso RBAC
# Despliegue completo: base de datos, API con WebSockets y aplicacion web
# Autor: Ing. Edgar Rojas Apaza - Desarrollo de Modulo de Tickets
# =====================================================================
services:
  base_datos:
    image: postgres:16-alpine
    container_name: tickets_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tickets_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env}
      POSTGRES_DB: ${DB_NAME:-tickets_ti}
      TZ: America/La_Paz
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    # La base solo se atiende dentro de la red del despliegue. Se publica en
    # la maquina anfitriona atada a su direccion local, nunca a la red externa.
    ports:
      - "127.0.0.1:${DB_PORT_EXPUESTO:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tickets_app} -d ${DB_NAME:-tickets_ti}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [red_tickets]

  # Aplica el esquema y todas las migraciones antes de levantar la API.
  # Corre en cada arranque: los archivos son idempotentes, de modo que una
  # base ya creada tambien recibe lo que se agrego despues.
  migraciones:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickets_migraciones
    restart: "no"
    depends_on:
      base_datos:
        condition: service_healthy
    environment:
      DB_HOST: base_datos
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tickets_app}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env}
      DB_NAME: ${DB_NAME:-tickets_ti}
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD en el archivo .env}
      TZ: America/La_Paz
    volumes:
      - ./db:/db:ro
    # La carga inicial crea la cuenta administradora con una clave conocida,
    # porque su hash viaja en el repositorio. Enseguida se reemplaza por la
    # que usted definio en el archivo .env, de modo que nunca queda publicada.
    command:
      - sh
      - -c
      - >-
        node src/scripts/migrate.js &&
        node src/scripts/clave.js "$${ADMIN_USUARIO:-admin}" "$$ADMIN_PASSWORD"
    networks: [red_tickets]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tickets_api
    restart: unless-stopped
    depends_on:
      base_datos:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: /api/v1
      DB_HOST: base_datos
      DB_PORT: 5432
      DB_USER: ${DB_USER:-tickets_app}
      DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD en el archivo .env}
      DB_NAME: ${DB_NAME:-tickets_ti}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en el archivo .env}
      CLAVE_CIFRADO: ${CLAVE_CIFRADO:?defina CLAVE_CIFRADO en el archivo .env}
      # Sobre HTTP la cookie de sesion no vuelve si va marcada como segura:
      # se entra y despues nada responde. Pongalo en true solo detras de HTTPS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORZAR_HTTPS: ${FORZAR_HTTPS:-false}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # Dentro de un contenedor la deteccion automatica de direcciones no
      # sirve: solo ve la red interna de Docker, no la del anfitrion. Escriba
      # aqui la direccion desde la que entra la gente, por ejemplo
      # http://192.168.0.37:8080
      CORS_ORIGINS: ${CORS_ORIGINS:?liste los origenes desde los que se entra}
      RED_LOCAL: "false"
      DOCS_OUTPUT_DIR: storage/documentos
      TZ: America/La_Paz
    volumes:
      # Repositorio documental: actas PDF generadas automaticamente
      - documentos_pdf:/app/storage/documentos
    ports:
      - "${API_PORT:-4000}:4000"
    networks: [red_tickets]

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_SOCKET_URL: ""
    container_name: tickets_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:80"
    networks: [red_tickets]

volumes:
  datos_postgres:
  documentos_pdf:

networks:
  red_tickets:
    driver: bridge
